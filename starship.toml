"$schema" = 'https://starship.rs/config-schema.json'

add_newline = false

format = "${custom.root}$hostname$username$directory$git_branch$git_status$nodejs$rust$golang$php$character"

[os]
disabled = false
format = "[$symbol](#blue) "

[os.symbols]
Ubuntu  = "󰕈"
Artix   = "󰣇"
Arch    = "󰣇"
CachyOS = "󰣇"
Macos   = ""

[directory]
format            = "[$path](bold cyan) "
truncation_length = 4
truncate_to_repo  = true

[git_branch]
symbol = " "
format = "on [$symbol $branch](bold purple) "

[git_status]
format     = "($ahead_behind$staged$modified$untracked$deleted$conflicted)"
ahead      = "[⇡$count ](bold cyan)"
behind     = "[⇣$count ](bold cyan)"
diverged   = "[⇡$ahead_count⇣$behind_count ](bold cyan)"
staged     = "[+$count ](bold green)"
modified   = "[●$count ](bold yellow)"
untracked  = "[?$count ](bold white)"
deleted    = "[✘$count ](bold red)"
conflicted = "[⚡$count ](bold red)"

[nodejs]
symbol = ""
format = "[$symbol $version](green) "

[rust]
symbol = ""
format = "[$symbol $version](red) "

[golang]
symbol = ""
format = "[$symbol $version](cyan) "

[php]
symbol = ""
format = "[$symbol $version](purple) "

[character]
success_symbol = "[❯](green)"
error_symbol   = "[❯](red)"
vimcmd_symbol  = "[❮](blue)"

[custom.root]
when   = '[ "$(id -u)" -eq 0 ]'
format = "[root](bold red) "

[username]
show_always = true
format      = "[~ $user 】]($style) "
style_user  = "bold blue"
style_root  = "bold red"

[hostname]
ssh_only = false
format   = "[【 $ssh_symbol$hostname](bold blue) "